<!DOCTYPE html>
<html lang="en">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <img src="images/logo.jpeg">
        <h2>Little Love Crafts</h2>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="reviews.html" class="active">Reviews</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section id="reviews">
    <h2>Customer Reviews 💬</h2>

    <!-- EXISTING REVIEWS -->
    <div id="reviewList">

        <div class="review-card">
            <p>“Amazing work! Loved the gift ❤️”</p>
            <h4>- Happy Customer</h4>
        </div>

    </div>

    <!-- 🔥 REVIEW FORM -->
    <div class="review-form">
        <h3>Leave a Review ✍️</h3>

        <input type="text" id="name" placeholder="Your Name">

        <textarea id="message" placeholder="Write your review..."></textarea>

        <button onclick="addReview()">Submit</button>
    </div>

</section>

<footer>
    <p>© Little Love Crafts 2527 💕</p>
</footer>
