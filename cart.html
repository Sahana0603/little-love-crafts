<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Craftifyy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAV BAR INJECTED HERE BY JS -->
    <header></header>

    <!-- CART PAGE HEADER -->
    <section style="padding: 40px 0 20px;">
        <div class="container">
            <h1 style="font-size:32px; font-family:var(--font-headings); font-weight:700;">Shopping Cart</h1>
            <p style="color:var(--text-muted); font-size:15px;">Review your customized creations before finalizing your order via WhatsApp.</p>
        </div>
    </section>

    <!-- CART CONTENT -->
    <section class="cart-section">
        <div class="container">
            <div class="cart-layout" id="cart-layout-container">
                <!-- Loaded dynamically by JS -->
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTED HERE BY JS -->
    <footer></footer>

    <!-- SUPABASE CLIENT & JS CONFIGS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
            window.addEventListener('cart-updated', renderCartPage);
        });

        async function renderCartPage() {
            const container = document.getElementById('cart-layout-container');
            if (!container) return;

            const cart = getCart();

            if (cart.length === 0) {
                container.style.gridTemplateColumns = '1fr';
                container.innerHTML = `
                    <div class="empty-cart-message">
                        <h3>Your Cart is Empty</h3>
                        <p style="margin-bottom: 24px;">Browse our collection of beautiful handmade crafts to find the perfect gift.</p>
                        <a href="shop.html" class="btn btn-primary">Start Shopping</a>
                    </div>
                `;
                return;
            }

            container.style.gridTemplateColumns = ''; // Restore grid structure
            
            // Build items list HTML
            let itemsHtml = '<div class="cart-items-container">';
            
            cart.forEach(item => {
                const customizationKey = JSON.stringify(item.customizations);
                const subtotal = item.price * item.quantity;
                const priceLabel = item.is_starts_from ? "Starts from " : "";
                
                // Compile customizations tags
                let customizationsHtml = '';
                if (item.customizations && Object.keys(item.customizations).length > 0) {
                    const cust = item.customizations;
                    customizationsHtml = '<div class="cart-item-customizations">';
                    if (cust.color) customizationsHtml += `<div><strong>Color/Theme:</strong> ${cust.color}</div>`;
                    if (cust.sizeOccasion) customizationsHtml += `<div><strong>Size/Occasion:</strong> ${cust.sizeOccasion}</div>`;
                    if (cust.message) customizationsHtml += `<div><strong>Custom text:</strong> "${cust.message}"</div>`;
                    if (cust.referenceUrl) customizationsHtml += `<div><strong>References:</strong> ${cust.referenceUrl}</div>`;
                    customizationsHtml += '</div>';
                }

                itemsHtml += `
                    <div class="cart-item">
                        <img src="${item.image_url}" alt="${item.name}" class="cart-item-img" onerror="this.src='images/logo.jpeg'">
                        <div class="cart-item-details">
                            <span class="product-card-category">${item.category}</span>
                            <h4>${item.name}</h4>
                            <div class="cart-item-price">${priceLabel}₹${item.price}</div>
                            ${customizationsHtml}
                        </div>
                        <div class="cart-item-actions">
                            <div class="quantity-controller">
                                <button class="qty-btn" onclick="handleQtyChange('${item.id}', '${escapeHtml(customizationKey)}', -1)">-</button>
                                <span class="qty-val">${item.quantity}</span>
                                <button class="qty-btn" onclick="handleQtyChange('${item.id}', '${escapeHtml(customizationKey)}', 1)">+</button>
                            </div>
                            <button class="remove-item-btn" onclick="handleRemoveItem('${item.id}', '${escapeHtml(customizationKey)}')">Remove</button>
                        </div>
                    </div>
                `;
            });
            
            itemsHtml += '</div>';

            // Build summary block HTML
            const total = getCartTotal();
            const summaryHtml = `
                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>₹${total}</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <span style="color:#2e7d32; font-weight:600;">Pan-India Delivery</span>
                    </div>
                    <div class="summary-row" style="color:var(--text-muted); font-size:12px;">
                        <span>*Delivery charges apply based on location</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>Total</span>
                        <span>₹${total}</span>
                    </div>
                    <p style="font-size:12px; color:var(--text-muted); margin-bottom:20px; line-height:1.4;">
                        Please note: Payment is processed via bank transfer or UPI after confirming your order customizations with the owner on WhatsApp. Prepaid orders only.
                    </p>
                    <button onclick="handleCheckout()" class="btn btn-primary" style="width:100%; display:flex; justify-content:center; gap:8px; align-items:center;">
                        <span>Checkout via WhatsApp 💬</span>
                    </button>
                    <a href="shop.html" class="btn btn-secondary" style="width:100%; margin-top:12px; text-align:center;">Continue Shopping</a>
                </div>
            `;

            container.innerHTML = itemsHtml + summaryHtml;
        }

        function handleQtyChange(id, keyJson, delta) {
            updateCartQuantity(id, JSON.parse(keyJson), delta);
        }

        function handleRemoveItem(id, keyJson) {
            removeFromCart(id, JSON.parse(keyJson));
        }

        async function handleCheckout() {
            const profile = await getCurrentUserProfile();
            checkoutViaWhatsApp(profile);
        }

        // Helper to safely pass JSON strings in HTML attributes
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
