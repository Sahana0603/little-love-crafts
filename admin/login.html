<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - Craftifyy</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- NAV BAR INJECTED HERE BY JS -->
    <header></header>

    <!-- OWNER AUTH CONTEXT -->
    <section class="auth-section">
        <div class="auth-container" style="border: 2px solid var(--accent-pink);">
            
            <span class="product-card-category" style="display:block; text-align:center; margin-bottom:8px;">Administrative Portal</span>
            <h2 style="font-family:var(--font-headings); font-size:24px; text-align:center; margin-bottom:10px; font-weight:700;">Owner Login</h2>
            <p style="text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:30px;">Enter your admin credentials to access the Owner Dashboard</p>

            <form id="owner-login-form" onsubmit="handleOwnerLogin(event)">
                <div class="form-group">
                    <label for="owner-phone">Admin Mobile Number</label>
                    <input type="tel" id="owner-phone" placeholder="Enter your mobile number" required pattern="[0-9]{10}">
                </div>
                
                <div class="form-group" style="margin-bottom:24px;">
                    <label for="owner-password">Password</label>
                    <input type="password" id="owner-password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn btn-primary" id="owner-submit-btn" style="width:100%;">Sign In as Owner</button>
            </form>
            
            <div id="owner-error-message" style="color:#c62828; text-align:center; font-size:14px; margin-top:20px; font-weight:600; display:none;"></div>
            <div id="owner-success-message" style="color:#2e7d32; text-align:center; font-size:14px; margin-top:20px; font-weight:600; display:none;"></div>
            
            <div style="text-align:center; margin-top:24px;">
                <a href="../login.html" style="font-size:13px; color:var(--text-muted); text-decoration:underline;">Customer Login Page ➡</a>
            </div>
            
        </div>
    </section>

    <!-- FOOTER INJECTED HERE BY JS -->
    <footer></footer>

    <!-- SUPABASE CLIENT & JS CONFIGS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/main.js"></script>
    
    <script>
        async function handleOwnerLogin(e) {
            e.preventDefault();
            
            const phone = document.getElementById('owner-phone').value;
            const pass = document.getElementById('owner-password').value;
            const errorDiv = document.getElementById('owner-error-message');
            const successDiv = document.getElementById('owner-success-message');
            const submitBtn = document.getElementById('owner-submit-btn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            submitBtn.textContent = 'Verifying admin credentials...';
            submitBtn.disabled = true;

            const { user, error } = await signInUser(phone, pass);

            if (error) {
                const cleanPhone = phone.trim().replace(/[^0-9]/g, '');
                if (cleanPhone === '7892510154' && error.message.includes('Invalid login credentials')) {
                    errorDiv.innerHTML = "Owner account not registered. Please register this account first on the customer signup page: <a href='../login.html?register=true' style='color:#c62828; font-weight:700; text-decoration:underline;'>Register Here</a>";
                } else {
                    errorDiv.textContent = error.message;
                }
                errorDiv.style.display = 'block';
                submitBtn.textContent = 'Sign In as Owner';
                submitBtn.disabled = false;
                return;
            }

            // Clear cached profile
            localStorage.removeItem('llc_user_profile');
            
            // Check Profile to confirm role
            const profile = await getCurrentUserProfile();
            
            if (profile && profile.role === 'admin') {
                successDiv.textContent = "Admin authorization successful! Redirecting to Dashboard...";
                successDiv.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                await signOutUser();
                const cleanPhone = phone.trim().replace(/[^0-9]/g, '');
                if (cleanPhone === '7892510154') {
                    errorDiv.innerHTML = "Access Denied: Your account role is set as 'customer'.<br><br>Please run this SQL query in your Supabase SQL Editor to elevate your profile role to administrator:<br><code style='display:block; background:#ffebee; padding:8px; margin-top:8px; border-radius:4px; font-size:12px; color:#c62828; text-align:left;'>UPDATE public.profiles SET role = 'admin' WHERE phone = '7892510154';</code>";
                } else {
                    errorDiv.textContent = "Access Denied: This account does not have owner/admin privileges.";
                }
                errorDiv.style.display = 'block';
                submitBtn.textContent = 'Sign In as Owner';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
